<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AikoWeb</title>

<style>
:root{
  --bg:#07090d;
  --panel:#10141d;
  --panel2:#171c27;
  --border:#242b38;
  --text:#f4f6fb;
  --muted:#8993a5;
  --accent:#7c5cff;
  --accent2:#9b84ff;
  --danger:#ff5577;
  --gold:#ffd166;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 15% 0%,rgba(124,92,255,.15),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(255,60,140,.08),transparent 25%),
    var(--bg);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* NAV */

.nav{
  height:70px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  gap:25px;
  padding:0 30px;
  background:rgba(7,9,13,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--accent);
}

.navlinks{
  display:flex;
  gap:5px;
}

.navlinks button{
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px 14px;
  border-radius:9px;
}

.navlinks button:hover,
.navlinks button.active{
  background:rgba(124,92,255,.14);
  color:white;
}

.navsearch{
  margin-left:auto;
  width:min(360px,42vw);
  position:relative;
}

.navsearch input{
  width:100%;
  height:42px;
  padding:0 15px 0 40px;
  border-radius:11px;
  border:1px solid var(--border);
  outline:none;
  color:white;
  background:var(--panel);
}

.navsearch input:focus{
  border-color:var(--accent);
}

.searchicon{
  position:absolute;
  left:14px;
  top:9px;
  color:var(--muted);
}

/* LAYOUT */

main{
  max-width:1500px;
  margin:auto;
  padding:30px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* HERO */

.hero{
  min-height:450px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background-size:cover;
  background-position:center;
  margin-bottom:42px;
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(5,7,11,.97),rgba(5,7,11,.65) 42%,rgba(5,7,11,.05)),
    linear-gradient(0deg,rgba(5,7,11,.98),transparent 60%);
}

.heroContent{
  position:absolute;
  z-index:2;
  left:50px;
  bottom:45px;
  max-width:650px;
}

.eyebrow{
  color:#b6a9ff;
  font-size:13px;
  font-weight:800;
  margin-bottom:12px;
}

.hero h1{
  margin:0;
  font-size:clamp(35px,5vw,65px);
  line-height:1;
}

.hero p{
  color:#ccd1dc;
  line-height:1.7;
  max-width:600px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.btn{
  border:0;
  padding:11px 18px;
  border-radius:10px;
  font-weight:800;
}

.primary{
  color:white;
  background:var(--accent);
}

.primary:hover{
  background:var(--accent2);
}

.secondary{
  color:white;
  background:rgba(255,255,255,.1);
  border:1px solid var(--border);
}

.secondary:hover{
  background:rgba(255,255,255,.16);
}

/* SECTION */

.section{
  margin-bottom:45px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.sectionTitle{
  font-size:22px;
  font-weight:900;
}

.muted{
  color:var(--muted);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:18px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  transition:.22s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(124,92,255,.55);
  box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.poster{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#151a23;
  cursor:pointer;
}

.cardBody{
  padding:12px;
}

.cardTitle{
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cardMeta{
  display:flex;
  gap:9px;
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.score{
  color:var(--gold);
}

.cardButtons{
  display:flex;
  gap:6px;
  padding:0 12px 12px;
}

.cardButtons button{
  flex:1;
  border:0;
  border-radius:7px;
  padding:8px 4px;
  background:var(--panel2);
  color:white;
  font-size:12px;
}

.cardButtons button:hover{
  background:var(--accent);
}

/* SEARCH */

.searchLarge{
  display:flex;
  gap:10px;
  margin-bottom:28px;
}

.searchLarge input{
  flex:1;
  min-width:0;
  padding:14px 16px;
  border-radius:11px;
  background:var(--panel);
  border:1px solid var(--border);
  color:white;
  outline:none;
}

.searchLarge input:focus{
  border-color:var(--accent);
}

/* DETAIL */

.detail{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:30px;
  padding:28px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--panel);
}

.detailPoster{
  width:100%;
  border-radius:12px;
}

.detail h1{
  font-size:40px;
  margin:0 0 12px;
}

.description{
  color:#c4cad5;
  line-height:1.8;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:18px 0;
}

.tag{
  padding:6px 10px;
  border-radius:20px;
  background:rgba(124,92,255,.13);
  color:#d0c7ff;
  font-size:12px;
}

.info{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  color:var(--muted);
  margin:18px 0;
}

.info strong{
  color:white;
}

/* WATCH */

.watchHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}

.watchTitle{
  margin:0;
  font-size:30px;
}

.playerLayout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:18px;
}

.player{
  background:#000;
  border-radius:15px;
  overflow:hidden;
  aspect-ratio:16/9;
  border:1px solid var(--border);
}

.player iframe{
  width:100%;
  height:100%;
  display:block;
  border:0;
}

.playerEmpty{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  color:var(--muted);
}

.playerEmpty .play{
  font-size:55px;
  color:var(--accent);
}

.episodesPanel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  max-height:600px;
  overflow:auto;
}

.episodesPanel h3{
  margin-top:0;
}

.episodeGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.episode{
  border:0;
  background:var(--panel2);
  color:white;
  border-radius:7px;
  padding:9px 3px;
}

.episode:hover,
.episode.active{
  background:var(--accent);
}

.language{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.language button{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:8px 15px;
  border-radius:8px;
}

.language button.active{
  color:white;
  background:var(--accent);
  border-color:var(--accent);
}

/* LOADING / ERROR */

.center{
  text-align:center;
  padding:70px 20px;
  color:var(--muted);
}

.spinner{
  width:38px;
  height:38px;
  margin:0 auto 16px;
  border:3px solid #282f3c;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.errorBox{
  padding:20px;
  background:rgba(255,85,119,.08);
  border:1px solid rgba(255,85,119,.25);
  color:#ff9db1;
  border-radius:12px;
  text-align:center;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
}

.modalTop{
  position:relative;
}

.modalTop img{
  width:100%;
  max-height:330px;
  object-fit:cover;
  opacity:.55;
}

.modalTop:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent,var(--panel));
}

.close{
  position:absolute;
  right:15px;
  top:15px;
  z-index:3;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:22px;
}

.modalBody{
  position:relative;
  z-index:2;
  margin-top:-100px;
  padding:25px;
}

.modalBody h1{
  font-size:35px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:1000;
  right:20px;
  bottom:20px;
  background:#202633;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  opacity:0;
  transform:translateY(80px);
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE */

@media(max-width:850px){

  .nav{
    padding:0 15px;
  }

  .navlinks{
    display:none;
  }

  .navsearch{
    width:100%;
  }

  main{
    padding:15px;
  }

  .hero{
    min-height:480px;
  }

  .heroContent{
    left:25px;
    right:25px;
    bottom:30px;
  }

  .detail{
    grid-template-columns:140px 1fr;
    padding:18px;
  }

  .detail h1{
    font-size:26px;
  }

  .playerLayout{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){

  .detail{
    grid-template-columns:1fr;
  }

  .detailPoster{
    max-width:180px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .watchTitle{
    font-size:22px;
  }
}
</style>
</head>

<body>

<nav class="nav">

  <div class="logo">
    AIKO<span>WEB</span>
  </div>

  <div class="navlinks">
    <button class="active" data-page="home">Home</button>
    <button data-page="search">Search</button>
    <button data-page="watchlist">Watchlist</button>
  </div>

  <div class="navsearch">
    <span class="searchicon">⌕</span>
    <input id="navSearch" placeholder="Search anime...">
  </div>

</nav>

<main>

<!-- HOME -->

<section id="home" class="page active">

  <div class="hero" id="hero">

    <div class="heroContent">

      <div class="eyebrow">FEATURED ANIME</div>

      <h1 id="heroTitle">Loading...</h1>

      <p id="heroDescription">
        Loading anime...
      </p>

      <div class="buttons">

        <button class="btn primary" id="heroWatch">
          ▶ Watch Now
        </button>

        <button class="btn secondary" id="heroInfo">
          More Info
        </button>

      </div>

    </div>

  </div>

  <div class="section">

    <div class="sectionHead">

      <div class="sectionTitle">
        🔥 Trending Now
      </div>

      <div class="muted">
        AniList
      </div>

    </div>

    <div id="trending" class="grid"></div>

  </div>

  <div class="section">

    <div class="sectionHead">
      <div class="sectionTitle">
        ⭐ Popular
      </div>
    </div>

    <div id="popular" class="grid"></div>

  </div>

</section>


<!-- SEARCH -->

<section id="search" class="page">

  <div class="sectionHead">

    <div>
      <div class="sectionTitle">Search Anime</div>
      <div class="muted">Find an anime and start watching</div>
    </div>

  </div>

  <div class="searchLarge">

    <input
      id="searchInput"
      placeholder="Search for anime..."
      autocomplete="off"
    >

    <button class="btn primary" id="searchButton">
      Search
    </button>

  </div>

  <div id="searchResults" class="grid"></div>

</section>


<!-- WATCHLIST -->

<section id="watchlist" class="page">

  <div class="sectionHead">

    <div>
      <div class="sectionTitle">❤️ My Watchlist</div>
      <div class="muted">Saved on this device</div>
    </div>

  </div>

  <div id="watchlistGrid" class="grid"></div>

</section>


<!-- WATCH -->

<section id="watch" class="page">

  <div class="watchHeader">

    <div>

      <button
        class="btn secondary"
        id="backButton"
      >
        ← Back
      </button>

      <h1 class="watchTitle" id="watchTitle">
        Anime
      </h1>

    </div>

    <div class="language">

      <button id="subButton" class="active">
        SUB
      </button>

      <button id="dubButton">
        DUB
      </button>

    </div>

  </div>

  <div class="playerLayout">

    <div>

      <div class="player" id="player">

        <div class="playerEmpty">
          <div class="play">▶</div>
          <div>Select an episode</div>
        </div>

      </div>

      <div
        style="
          margin-top:12px;
          color:var(--muted);
          font-size:13px;
        "
        id="currentEpisode"
      >
        No episode selected
      </div>

    </div>

    <aside class="episodesPanel">

      <h3>Episodes</h3>

      <div
        id="episodeGrid"
        class="episodeGrid"
      ></div>

    </aside>

  </div>

</section>

</main>


<!-- DETAIL MODAL -->

<div class="modal" id="modal">

  <div class="modalBox">

    <div class="modalTop">

      <button class="close" id="closeModal">
        ×
      </button>

      <img id="modalBanner" alt="">

    </div>

    <div class="modalBody">

      <h1 id="modalTitle"></h1>

      <div class="info">

        <span>
          ⭐ <strong id="modalScore"></strong>
        </span>

        <span>
          📺 <strong id="modalEpisodes"></strong>
        </span>

        <span>
          📅 <strong id="modalYear"></strong>
        </span>

      </div>

      <div class="tags" id="modalTags"></div>

      <p
        class="description"
        id="modalDescription"
      ></p>

      <div class="buttons">

        <button
          class="btn primary"
          id="modalWatch"
        >
          ▶ Watch
        </button>

        <button
          class="btn secondary"
          id="modalList"
        >
          ❤️ Watchlist
        </button>

      </div>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const ANILIST_API = "https://graphql.anilist.co";

/*
   JustPlay currently documents this format:

   ?ani=ANILIST_ID&ep=EPISODE&lang=sub

   We generate it automatically.
*/

const JUSTPLAY_URL =
  "https://justplay.boo/embed";


/* =========================================================
   APPLICATION STATE
   ========================================================= */

let featuredAnime = null;
let selectedAnime = null;

let currentLanguage =
  localStorage.getItem("aikoweb_language") || "sub";

let watchlist =
  loadStorage("aikoweb_watchlist", []);

let lastPage = "home";


/* =========================================================
   STORAGE
   ========================================================= */

function loadStorage(key, fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(!value){
      return fallback;
    }

    return JSON.parse(value);

  }catch{

    return fallback;
  }
}

function saveStorage(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch{}
}


/* =========================================================
   DOM HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   PAGE SYSTEM
   ========================================================= */

document.querySelectorAll("[data-page]")
  .forEach(button => {

    button.addEventListener("click",() => {

      showPage(
        button.dataset.page,
        button
      );

    });

  });


function showPage(page, activeButton){

  document.querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );

  const target = $(page);

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".navlinks button")
    .forEach(b =>
      b.classList.remove("active")
    );

  if(activeButton){
    activeButton.classList.add("active");
  }

  if(page === "watchlist"){
    renderWatchlist();
  }

  lastPage = page;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   ANILIST GRAPHQL
   ========================================================= */

const MEDIA_FRAGMENT = `
  id

  title {
    romaji
    english
    native
  }

  coverImage {
    large
    extraLarge
  }

  bannerImage

  description

  averageScore

  episodes

  duration

  season

  seasonYear

  status

  genres

  format

  isAdult
`;


async function aniListRequest(query,variables={}){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      15000
    );

  try{

    const response =
      await fetch(
        ANILIST_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({
            query,
            variables
          }),

          signal:controller.signal
        }
      );

    const text =
      await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        "AniList returned an invalid response."
      );
    }

    if(!response.ok){

      throw new Error(
        data?.errors?.[0]?.message ||
        `AniList HTTP ${response.status}`
      );
    }

    if(data.errors?.length){

      throw new Error(
        data.errors
          .map(e => e.message)
          .join(", ")
      );
    }

    return data.data;

  }finally{

    clearTimeout(timeout);
  }
}


/* =========================================================
   HOME QUERY
   ========================================================= */

const HOME_QUERY = `
query {

  trending: Page(
    page:1,
    perPage:12
  ){
    media(
      type:ANIME,
      sort:TRENDING_DESC
    ){
      ${MEDIA_FRAGMENT}
    }
  }

  popular: Page(
    page:1,
    perPage:12
  ){
    media(
      type:ANIME,
      sort:POPULARITY_DESC
    ){
      ${MEDIA_FRAGMENT}
    }
  }

}
`;


async function loadHome(){

  const trending =
    $("trending");

  const popular =
    $("popular");

  loadingGrid(trending);
  loadingGrid(popular);

  try{

    const data =
      await aniListRequest(
        HOME_QUERY
      );

    const trendingAnime =
      data?.trending?.media || [];

    const popularAnime =
      data?.popular?.media || [];

    renderGrid(
      trending,
      trendingAnime
    );

    renderGrid(
      popular,
      popularAnime
    );

    if(trendingAnime.length){

      featuredAnime =
        trendingAnime[0];

      setupHero(
        featuredAnime
      );
    }

  }catch(error){

    console.error(error);

    const message =
      friendlyError(error);

    errorGrid(trending,message);
    errorGrid(popular,message);

    $("heroTitle").textContent =
      "Unable to load anime";

    $("heroDescription").textContent =
      message;
  }
}


/* =========================================================
   SEARCH QUERY
   ========================================================= */

const SEARCH_QUERY = `
query($search:String){

  Page(
    page:1,
    perPage:24
  ){

    media(
      type:ANIME,
      search:$search,
      sort:SEARCH_MATCH
    ){

      ${MEDIA_FRAGMENT}

    }

  }

}
`;


async function performSearch(){

  const input =
    $("searchInput");

  const query =
    input.value.trim();

  if(!query){

    input.focus();

    return;
  }

  showPage("search");

  const results =
    $("searchResults");

  loadingGrid(results);

  try{

    const data =
      await aniListRequest(
        SEARCH_QUERY,
        {search:query}
      );

    const anime =
      data?.Page?.media || [];

    if(!anime.length){

      results.innerHTML = `
        <div class="center"
             style="grid-column:1/-1">
          No anime found for
          <strong>${escapeHTML(query)}</strong>.
        </div>
      `;

      return;
    }

    renderGrid(
      results,
      anime
    );

  }catch(error){

    console.error(error);

    errorGrid(
      results,
      friendlyError(error)
    );
  }
}


/* =========================================================
   SEARCH EVENTS
   ========================================================= */

$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );

$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        performSearch();
      }

    }
  );


$("navSearch")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        const value =
          $("navSearch")
            .value
            .trim();

        if(value){

          $("searchInput").value =
            value;

          performSearch();
        }
      }

    }
  );


/* =========================================================
   GRID
   ========================================================= */

function renderGrid(container,anime){

  container.innerHTML = "";

  anime.forEach(item => {

    container.appendChild(
      createCard(item)
    );

  });
}


function loadingGrid(container){

  container.innerHTML = `
    <div
      class="center"
      style="grid-column:1/-1"
    >
      <div class="spinner"></div>
      Loading...
    </div>
  `;
}


function errorGrid(container,message){

  container.innerHTML = `
    <div
      class="errorBox"
      style="grid-column:1/-1"
    >
      <strong>Couldn't load anime</strong>
      <br><br>
      ${escapeHTML(message)}
      <br><br>
      <button
        class="btn secondary"
        onclick="location.reload()"
      >
        Retry
      </button>
    </div>
  `;
}


/* =========================================================
   CARD
   ========================================================= */

function createCard(anime){

  const card =
    document.createElement("article");

  card.className = "card";

  const title =
    getTitle(anime);

  const image =
    anime.coverImage?.extraLarge ||
    anime.coverImage?.large ||
    "";

  const score =
    anime.averageScore
      ? (anime.averageScore / 10).toFixed(1)
      : "N/A";

  card.innerHTML = `

    <img
      class="poster"
      src="${escapeAttr(image)}"
      alt="${escapeAttr(title)}"
      loading="lazy"
    >

    <div class="cardBody">

      <div
        class="cardTitle"
        title="${escapeAttr(title)}"
      >
        ${escapeHTML(title)}
      </div>

      <div class="cardMeta">

        <span class="score">
          ★ ${score}
        </span>

        <span>
          ${escapeHTML(anime.format || "ANIME")}
        </span>

      </div>

    </div>

    <div class="cardButtons">

      <button data-info>
        Info
      </button>

      <button data-watch>
        ▶ Watch
      </button>

    </div>
  `;

  card.querySelector(".poster")
    .addEventListener(
      "click",
      () => openDetails(anime)
    );

  card.querySelector("[data-info]")
    .addEventListener(
      "click",
      () => openDetails(anime)
    );

  card.querySelector("[data-watch]")
    .addEventListener(
      "click",
      () => watchAnime(anime)
    );

  return card;
}


/* =========================================================
   HERO
   ========================================================= */

function setupHero(anime){

  const title =
    getTitle(anime);

  const image =
    anime.bannerImage ||
    anime.coverImage?.extraLarge ||
    anime.coverImage?.large ||
    "";

  $("hero").style.backgroundImage =
    `url("${escapeAttr(image)}")`;

  $("heroTitle").textContent =
    title;

  $("heroDescription").textContent =
    cleanDescription(
      anime.description
    );
}


$("heroWatch")
  .addEventListener(
    "click",
    () => {

      if(featuredAnime){
        watchAnime(
          featuredAnime
        );
      }

    }
  );


$("heroInfo")
  .addEventListener(
    "click",
    () => {

      if(featuredAnime){
        openDetails(
          featuredAnime
        );
      }

    }
  );


/* =========================================================
   DETAILS
   ========================================================= */

function openDetails(anime){

  selectedAnime = anime;

  const title =
    getTitle(anime);

  $("modalTitle").textContent =
    title;

  $("modalBanner").src =
    anime.bannerImage ||
    anime.coverImage?.extraLarge ||
    anime.coverImage?.large ||
    "";

  $("modalScore").textContent =
    anime.averageScore
      ? (anime.averageScore / 10).toFixed(1)
      : "N/A";

  $("modalEpisodes").textContent =
    anime.episodes || "?";

  $("modalYear").textContent =
    anime.seasonYear || "?";

  $("modalDescription").textContent =
    cleanDescription(
      anime.description
    );

  const tags =
    $("modalTags");

  tags.innerHTML = "";

  (anime.genres || [])
    .forEach(genre => {

      const span =
        document.createElement("span");

      span.className = "tag";

      span.textContent =
        genre;

      tags.appendChild(span);
    });

  $("modal").classList.add("show");
}


$("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


$("modal")
  .addEventListener(
    "click",
    event => {

      if(event.target === $("modal")){
        closeModal();
      }

    }
  );


function closeModal(){

  $("modal")
    .classList.remove("show");
}


$("modalWatch")
  .addEventListener(
    "click",
    () => {

      closeModal();

      if(selectedAnime){
        watchAnime(
          selectedAnime
        );
      }

    }
  );


$("modalList")
  .addEventListener(
    "click",
    () => {

      if(selectedAnime){

        toggleWatchlist(
          selectedAnime
        );

      }

    }
  );


/* =========================================================
   WATCHLIST
   ========================================================= */

function toggleWatchlist(anime){

  const index =
    watchlist.findIndex(
      item => item.id === anime.id
    );

  if(index >= 0){

    watchlist.splice(
      index,
      1
    );

    toast(
      "Removed from watchlist"
    );

  }else{

    watchlist.push(anime);

    toast(
      "Added to watchlist ❤️"
    );
  }

  saveStorage(
    "aikoweb_watchlist",
    watchlist
  );

  renderWatchlist();
}


function renderWatchlist(){

  const grid =
    $("watchlistGrid");

  if(!watchlist.length){

    grid.innerHTML = `
      <div
        class="center"
        style="grid-column:1/-1"
      >
        <div style="font-size:45px">
          ❤️
        </div>

        <br>

        Your watchlist is empty.

        <br><br>

        Search for anime and add them here.
      </div>
    `;

    return;
  }

  renderGrid(
    grid,
    watchlist
  );
}


/* =========================================================
   WATCHING
   ========================================================= */

function watchAnime(anime){

  selectedAnime = anime;

  showPage("watch");

  $("watchTitle").textContent =
    getTitle(anime);

  buildEpisodes(anime);

  /*
    Automatically select episode 1.
  */

  selectEpisode(
    anime,
    1
  );
}


function buildEpisodes(anime){

  const grid =
    $("episodeGrid");

  grid.innerHTML = "";

  const count =
    Number(anime.episodes) || 1;

  for(
    let episode = 1;
    episode <= count;
    episode++
  ){

    const button =
      document.createElement("button");

    button.className =
      "episode";

    button.textContent =
      episode;

    button.addEventListener(
      "click",
      () => {

        selectEpisode(
          anime,
          episode
        );

      }
    );

    grid.appendChild(
      button
    );
  }
}


/* =========================================================
   JUSTPLAY PLAYER
   ========================================================= */

function selectEpisode(anime,episode){

  selectedAnime = anime;

  document.querySelectorAll(".episode")
    .forEach(button => {

      button.classList.toggle(
        "active",
        Number(button.textContent) === episode
      );

    });

  $("currentEpisode").textContent =
    `${getTitle(anime)} — Episode ${episode} — ${currentLanguage.toUpperCase()}`;

  /*
    JustPlay documented parameters:

      ani   = AniList ID
      ep    = episode number
      lang  = sub or dub

    We generate the iframe automatically.
  */

  const params =
    new URLSearchParams();

  params.set(
    "ani",
    anime.id
  );

  params.set(
    "ep",
    episode
  );

  params.set(
    "lang",
    currentLanguage
  );

  params.set(
    "autoplay",
    "1"
  );

  params.set(
    "autoskip",
    "1"
  );

  const playerURL =
    `${JUSTPLAY_URL}?${params.toString()}`;

  $("player").innerHTML = `

    <iframe
      src="${escapeAttr(playerURL)}"
      title="${escapeAttr(getTitle(anime))}"
      allow="
        autoplay;
        fullscreen;
        picture-in-picture;
        encrypted-media
      "
      allowfullscreen
      referrerpolicy="origin"
    ></iframe>

  `;

  saveStorage(
    "aikoweb_last_anime",
    anime
  );

  saveStorage(
    "aikoweb_last_episode",
    {
      animeId:anime.id,
      episode
    }
  );
}


/* =========================================================
   LANGUAGE
   ========================================================= */

$("subButton")
  .addEventListener(
    "click",
    () => {

      currentLanguage =
        "sub";

      updateLanguageButtons();

      saveStorage(
        "aikoweb_language",
        currentLanguage
      );

      if(selectedAnime){

        const saved =
          loadStorage(
            "aikoweb_last_episode",
            {episode:1}
          );

        selectEpisode(
          selectedAnime,
          saved.animeId === selectedAnime.id
            ? saved.episode
            : 1
        );

      }

    }
  );


$("dubButton")
  .addEventListener(
    "click",
    () => {

      currentLanguage =
        "dub";

      updateLanguageButtons();

      saveStorage(
        "aikoweb_language",
        currentLanguage
      );

      if(selectedAnime){

        const saved =
          loadStorage(
            "aikoweb_last_episode",
            {episode:1}
          );

        selectEpisode(
          selectedAnime,
          saved.animeId === selectedAnime.id
            ? saved.episode
            : 1
        );

      }

    }
  );


function updateLanguageButtons(){

  $("subButton")
    .classList.toggle(
      "active",
      currentLanguage === "sub"
    );

  $("dubButton")
    .classList.toggle(
      "active",
      currentLanguage === "dub"
    );
}


/* =========================================================
   BACK
   ========================================================= */

$("backButton")
  .addEventListener(
    "click",
    () => {

      showPage(
        lastPage === "watch"
          ? "home"
          : lastPage
      );

    }
  );


/* =========================================================
   UTILITIES
   ========================================================= */

function getTitle(anime){

  return anime?.title?.english ||
         anime?.title?.romaji ||
         anime?.title?.native ||
         "Unknown Anime";
}


function cleanDescription(value){

  if(!value){
    return "No description available.";
  }

  return String(value)
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<[^>]*>/g,"")
    .replace(/&amp;/g,"&")
    .replace(/&quot;/g,'"')
    .replace(/&#039;/g,"'")
    .trim();
}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return escapeHTML(value);
}


function friendlyError(error){

  if(error?.name === "AbortError"){
    return "The request timed out. Please try again.";
  }

  if(
    error?.message?.includes(
      "Failed to fetch"
    )
  ){

    return (
      "The browser could not reach AniList. " +
      "Check your internet connection, " +
      "then try again."
    );
  }

  return error?.message ||
    "An unexpected error occurred.";
}


function toast(message){

  const element =
    $("toast");

  element.textContent =
    message;

  element.classList.add("show");

  setTimeout(
    () =>
      element.classList.remove("show"),
    2500
  );
}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      closeModal();
    }

    if(
      event.key === "/" &&
      document.activeElement.tagName !== "INPUT"
    ){

      event.preventDefault();

      $("navSearch").focus();
    }

  }
);


/* =========================================================
   START APPLICATION
   ========================================================= */

updateLanguageButtons();

loadHome();

</script>
